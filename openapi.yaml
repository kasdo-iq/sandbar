openapi: 3.0.0
info:
  title: App API
  version: "1.0.0"
  description: >
    This API provides endpoints for file uploads/downloads, browser actions, terminal interactions, text editor actions, 
    sandbox initialization, health checks, and project zipping & uploading. The `/terminal` endpoint is a WebSocket 
    endpoint for real-time terminal interactions.
servers:
  - url: http://localhost:8330
paths:
  /file/upload_to_s3:
    post:
      summary: Upload File to S3
      description: >
        Upload a file to S3. If the file size exceeds a predefined threshold, returns information to perform a multipart upload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                file_path:
                  type: string
                presigned_url:
                  type: string
              required:
                - file_path
                - presigned_url
      responses:
        '200':
          description: Successful file upload or multipart upload info returned.
        '404':
          description: File not found.
        '500':
          description: Upload failed.
  /file/multipart_upload_to_s3:
    post:
      summary: Multipart Upload to S3
      description: Upload file parts using presigned URLs for multipart uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultipartUploadRequest'
      responses:
        '200':
          description: All parts uploaded successfully.
        '206':
          description: Partial success with some parts failed.
        '400':
          description: Bad Request.
        '500':
          description: Server error.
  /file:
    get:
      summary: Download File
      description: Download a file from the specified path.
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
          description: The file path to download.
      responses:
        '200':
          description: File returned.
        '404':
          description: File not found.
        '500':
          description: Error serving file.
  /request-download-attachments:
    post:
      summary: Batch Download Attachments
      description: >
        Batch download files from the specified URLs and optionally save them to a subfolder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
      responses:
        '200':
          description: Batch download completed.
        '500':
          description: Error during download.
  /browser/status:
    get:
      summary: Browser Status
      description: Get the current status of the browser manager.
      responses:
        '200':
          description: Browser status returned.
  /browser/action:
    post:
      summary: Browser Action
      description: Execute a browser action (e.g., navigation, interaction).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserActionRequest'
      responses:
        '200':
          description: Browser action executed.
  /text_editor:
    post:
      summary: Text Editor Action
      description: Perform a text editor action such as opening or updating a file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextEditorAction'
      responses:
        '200':
          description: Text editor action result.
        '500':
          description: Error performing action.
  /init-sandbox:
    post:
      summary: Initialize Sandbox Environment
      description: >
        Initialize the sandbox by writing provided secrets to the user's .secrets directory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secrets:
                  type: object
                  additionalProperties:
                    type: string
              required:
                - secrets
      responses:
        '200':
          description: Sandbox initialized.
        '500':
          description: Error processing secrets.
  /healthz:
    get:
      summary: Health Check
      description: Health check endpoint.
      responses:
        '200':
          description: Service is healthy.
  /zip-and-upload:
    post:
      summary: Zip and Upload Directory
      description: >
        Zip a directory (excluding specified folders) and upload the resulting archive to S3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZipAndUploadRequest'
      responses:
        '200':
          description: Project processed and uploaded.
        '500':
          description: Error during processing.
  /terminal/{terminal_id}/reset:
    post:
      summary: Reset Terminal
      description: Reset a specific terminal identified by terminal_id.
      parameters:
        - in: path
          name: terminal_id
          required: true
          schema:
            type: string
          description: The terminal identifier.
      responses:
        '200':
          description: Terminal reset successfully.
        '500':
          description: Error resetting terminal.
  /terminal/reset-all:
    post:
      summary: Reset All Terminals
      description: Reset all active terminals.
      responses:
        '200':
          description: All terminals reset successfully.
        '500':
          description: Error resetting terminals.
  /terminal/{terminal_id}/view:
    get:
      summary: View Terminal History
      description: >
        View the terminal history. Use the query parameter `full` to toggle between full history and only the latest output.
      parameters:
        - in: path
          name: terminal_id
          required: true
          schema:
            type: string
          description: The terminal identifier.
        - in: query
          name: full
          required: false
          schema:
            type: boolean
            default: true
          description: If true, returns full history; otherwise, returns only the last output.
      responses:
        '200':
          description: Terminal history returned.
        '500':
          description: Error viewing history.
  /terminal/{terminal_id}/kill:
    post:
      summary: Kill Terminal Process
      description: Kill the current process running in the specified terminal.
      parameters:
        - in: path
          name: terminal_id
          required: true
          schema:
            type: string
          description: The terminal identifier.
      responses:
        '200':
          description: Terminal process killed.
        '500':
          description: Error killing process.
  /terminal/{terminal_id}/write:
    post:
      summary: Write to Terminal
      description: >
        Write input to a terminal process (optionally simulating an "enter" key press).
      parameters:
        - in: path
          name: terminal_id
          required: true
          schema:
            type: string
          description: The terminal identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalWriteApiRequest'
      responses:
        '200':
          description: Terminal write successful.
        '500':
          description: Error writing to terminal.
  /terminal:
    get:
      summary: Terminal WebSocket Endpoint
      description: >
        Establish a WebSocket connection for real-time terminal interactions. 
        **Note:** This is a WebSocket endpoint and not accessible via standard HTTP requests.
        Auth (Phase 3): the connection must present `x-sandbox-token` / `Authorization: Bearer`
        header (or `?token=` query fallback) **before** the handshake is accepted;
        otherwise the socket is closed with code 1008.
      responses:
        '101':
          description: Switching Protocols (WebSocket handshake successful).
        '403':
          description: Handshake rejected (missing/invalid token).
  /llm/providers:
    get:
      summary: List LLM Providers
      description: >
        Providers configured via providers.yaml (+ LLM_* env overrides).
        `api_key_env` is the NAME of the env var holding the key; no keys are ever returned.
      security:
        - SandboxToken: []
      responses:
        '200':
          description: Provider listing.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LlmProviderInfo'
  /llm/chat:
    post:
      summary: Chat via configured provider chain
      description: >
        One-shot (stream=false, JSON body) or SSE-streaming chat (stream=true,
        text/event-stream with delta/tool_call/final/error events, terminated by `data: [DONE]`).
        Per-request `provider`/`model` override the default chain; configured
        fallback providers are tried in order (retry + exponential backoff) on
        rate limits/transient errors.
      security:
        - SandboxToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmChatRequest'
      responses:
        '200':
          description: Non-streaming chat result (stream=false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmResponse'
        '200+text/event-stream':
          description: SSE stream (stream=true).
        '401':
          description: Missing/invalid token.
        '429':
          description: Too many failed auth attempts.
        '502':
          description: All providers failed.
  /tools:
    get:
      summary: List Registered Tools
      description: >-
        All sandbox tools (builtin + custom_tools/*.py) with their JSON Schemas.
      security:
        - SandboxToken: []
      responses:
        '200':
          description: Tool listing.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolInfo'
  /tools/{name}/run:
    post:
      summary: Run a Tool
      description: >
        Execute one registered tool. Body is the arguments object itself
        (or {"arguments": {...}}). Response mirrors the tool result dict
        (status/output/...).
      security:
        - SandboxToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Tool name (see GET /tools).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Tool result dict.
        '401':
          description: Missing/invalid token.
        '404':
          description: Unknown tool.
        '500':
          description: Tool raised an error.
        '504':
          description: Tool timed out (180s cap).
  /agent/run:
    post:
      summary: Run the Agent Loop (SSE)
      description: >
        LLM tool-calling loop: goal -> provider chain w/ tool schemas -> execute
        tool calls -> feed results back, until a final answer or max_steps.
        Streams steps as SSE events (step_start, assistant_text, tool_call,
        tool_result, final_answer, error), terminated by `data: [DONE]`.
        Hard limits: max_steps, total_timeout_seconds, output truncation.
      security:
        - SandboxToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunRequest'
      responses:
        '200':
          description: SSE event stream.
        '401':
          description: Missing/invalid token.

components:
  securitySchemes:
    SandboxToken:
      type: apiKey
      in: header
      name: x-sandbox-token
      description: >
        Sandbox token from env SANDBOX_API_TOKEN. Alternatively send
        `Authorization: Bearer <token>`. Applied to every endpoint except
        GET /healthz (and WebSocket /terminal pre-accept, closing 1008).
  schemas:
    MultipartUploadRequest:
      type: object
      properties:
        file_path:
          type: string
        presigned_urls:
          type: array
          items:
            type: object
            properties:
              part_number:
                type: integer
              url:
                type: string
            required:
              - part_number
              - url
        part_size:
          type: integer
      required:
        - file_path
        - presigned_urls
        - part_size
    DownloadItem:
      type: object
      properties:
        url:
          type: string
        filename:
          type: string
      required:
        - url
        - filename
    DownloadRequest:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/DownloadItem'
        folder:
          type: string
      required:
        - files
    BrowserActionRequest:
      type: object
      properties:
        action:
          type: string
        url:
          type: string
      required:
        - action
        - url
    TextEditorAction:
      type: object
      properties:
        action:
          type: string
        file_path:
          type: string
        content:
          type: string
      required:
        - action
        - file_path
    TerminalWriteApiRequest:
      type: object
      properties:
        text:
          type: string
        enter:
          type: boolean
      required:
        - text
    ZipAndUploadRequest:
      type: object
      properties:
        directory:
          type: string
        upload_url:
          type: string
        project_type:
          type: string
          enum:
            - frontend
            - backend
            - nextjs
      required:
        - directory
        - upload_url
        - project_type
    LlmProviderInfo:
      type: object
      properties:
        name:
          type: string
        api_family:
          type: string
          enum: [openai-compatible, anthropic, gemini]
        enabled:
          type: boolean
        configured:
          type: boolean
          description: Whether the api_key_env variable is present in the environment.
        api_key_env:
          type: string
          description: NAME of the env var holding the key (never the key itself).
        model:
          type: string
        base_url:
          type: string
          nullable: true
        default:
          type: boolean
        error:
          type: string
          nullable: true
          description: Construction error (e.g. key missing) if the provider is unavailable.
    LlmChatRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/LlmMessage'
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        tools:
          type: array
          nullable: true
          description: 'OpenAI function format: [{type: function, function: {name, description, parameters}}].'
        temperature:
          type: number
          nullable: true
        max_tokens:
          type: integer
          nullable: true
        stream:
          type: boolean
          default: false
      required:
        - messages
    LlmMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
        name:
          type: string
          nullable: true
          description: Tool name for role=tool (needed by Gemini function responses).
        tool_call_id:
          type: string
          nullable: true
        tool_calls:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/LlmToolCall'
      required:
        - role
        - content
    LlmToolCall:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        arguments:
          type: object
      required:
        - name
    LlmResponse:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        content:
          type: string
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/LlmToolCall'
        usage:
          type: object
          nullable: true
        finish_reason:
          type: string
          nullable: true
    ToolInfo:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
          description: JSON Schema for the POST /tools/{name}/run body.
    AgentRunRequest:
      type: object
      properties:
        goal:
          type: string
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        tools:
          type: array
          nullable: true
          items:
            type: string
          description: Subset of tool names (default all).
        max_steps:
          type: integer
          nullable: true
          description: Hard step cap (default env AGENT_MAX_STEPS, 15).
        system_prompt:
          type: string
          nullable: true
        total_timeout_seconds:
          type: number
          nullable: true
          description: Whole-loop timeout (default env AGENT_TOTAL_TIMEOUT, 300).
      required:
        - goal
