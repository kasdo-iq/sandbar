# Ruff config: strict for files written in this modernization effort,
# relaxed for the original reverse-engineered sources.
target-version = "py311"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "B", "BLE", "C4", "RUF", "SIM", "S", "W"]
ignore = ["G004", "TRY003"]

[lint.per-file-ignores]
# Original (pre-modernization) code: readability kept as-is.
"browser_use/**" = ["B", "BLE", "C4", "RUF", "SIM", "S", "E4", "E7", "E9", "F", "W"]
"app/tools/browser/**" = ["B", "BLE", "C4", "RUF", "SIM", "S", "E4", "E7", "E9", "F", "W"]
"app/server.py" = ["BLE", "B008", "B904", "E402", "F841", "S", "E722", "RUF006", "RUF002", "SIM102", "SIM105"]
"app/tools/text_editor.py" = ["BLE", "B904", "B007", "F841", "RUF059", "SIM102", "SIM105"]
"app/tools/terminal/**" = ["BLE", "B904", "B007", "E402", "F841", "RUF002", "RUF013", "RUF059", "S", "S110", "S108", "SIM115", "SIM102"]
"app/terminal_socket_server.py" = ["B", "BLE", "S", "F", "SIM102"]
"app/helpers/**" = ["B", "BLE", "S", "RUF002", "SIM115", "F841"]
"app/router.py" = ["B", "BLE", "S"]
"app/logger.py" = ["S"]
"app/auth.py" = ["S"]
"start_server.py" = ["BLE", "S104"]
"data_api.py" = ["S", "BLE"]
# tests: plain asserts everywhere
"tests/**" = ["S101", "S105", "S106"]
